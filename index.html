<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEKORCHU</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#0b0b10;
  --panel:#14141c;
  --gold:#d4af37;
  --text:#f5f5f5;
}
*{box-sizing:border-box;font-family:Segoe UI}
body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden}

/* ARKA PLAN */
.pattern{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 20% 30%, rgba(212,175,55,.15), transparent 40%),
    repeating-linear-gradient(45deg, rgba(212,175,55,.05), transparent 50px);
  animation:bg 60s linear infinite;
}
@keyframes bg{to{background-position:1000px 1000px}}

/* HEADER */
header{
  display:flex;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid #222;
}
.logo{
  font-size:30px;color:var(--gold);
  animation:glow 3s infinite;
}
@keyframes glow{
  0%,100%{text-shadow:0 0 10px var(--gold)}
  50%{text-shadow:0 0 30px var(--gold)}
}

nav button{
  border:1px solid var(--gold);
  background:transparent;color:var(--gold);
  padding:6px 12px;border-radius:8px;
  cursor:pointer;transition:.3s;
}
nav button:hover{background:var(--gold);color:#000}

/* CARD */
.container{
  max-width:520px;margin:25px auto;
  background:var(--panel);
  padding:20px;border-radius:14px;
  animation:fade .4s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}

.hidden{display:none}

/* INPUT */
input,select,textarea{
  width:100%;margin-top:10px;
  padding:10px;border-radius:8px;
  background:#101018;border:1px solid #333;color:#fff;
}

/* BUTTON */
button.main{
  width:100%;margin-top:14px;
  padding:12px;border-radius:10px;
  background:linear-gradient(135deg,#f5d76e,#d4af37);
  border:none;color:#000;cursor:pointer;
  box-shadow:0 0 15px rgba(212,175,55,.5);
  transition:.3s;
}
button.main:hover{
  transform:scale(1.03);
  box-shadow:0 0 30px rgba(212,175,55,.9);
}

.small-btn{
  border:1px solid var(--gold);
  background:transparent;color:var(--gold);
  padding:4px 8px;border-radius:6px;
  cursor:pointer;margin-top:5px;
}

/* BLOKLAR */
.room{margin-top:10px;padding:10px;background:#1b1b26;border-radius:10px}
.wall{margin-top:6px;padding:6px;background:#20202b;border-radius:6px}

/* TOAST */
#toast{
  position:fixed;
  bottom:20px;left:50%;
  transform:translateX(-50%);
  background:var(--gold);
  color:#000;padding:10px 18px;
  border-radius:8px;
  display:none;
  box-shadow:0 0 20px rgba(212,175,55,.8);
}
</style>
</head>

<body>
<div class="pattern"></div>

<header>
  <div class="logo">DEKORCHU</div>
  <nav>
    <button onclick="show('order')">Sipariş</button>
    <button onclick="show('adminLogin')">Yönetici</button>
  </nav>
</header>

<div id="toast"></div>

<!-- SİPARİŞ -->
<div class="container" id="order">
  <h3>Müşteri</h3>
  <input id="custName" placeholder="Ad Soyad">
  <input id="custPhone" maxlength="10" placeholder="5XXXXXXXXX"
    oninput="this.value=this.value.replace(/[^0-9]/g,'')">
  <button class="main" onclick="goHouse()">Devam</button>
</div>

<!-- EV -->
<div class="container hidden" id="house">
  <select id="houseType" onchange="loadRooms()">
    <option value="">Ev tipi</option>
    <option>1+1</option><option>2+1</option><option>3+1</option>
  </select>
  <div id="rooms"></div>
  <button class="main" onclick="saveOrder()">Kaydet</button>
</div>

<!-- ADMIN -->
<div class="container hidden" id="adminLogin">
  <input id="adminUser" placeholder="Kullanıcı">
  <input id="adminPass" type="password" placeholder="Şifre">
  <button class="main" onclick="adminLogin()">Giriş</button>
</div>

<div class="container hidden" id="admin">
  <h3>Katalog</h3>
  <input id="catalogName">
  <button class="main" onclick="addCatalog()">Ekle</button>
  <div id="catalogList"></div>

  <h3>Siparişler</h3>
  <div id="orderHistory"></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyB_uliTJMGnjbA65mlGo3Mu20A8w-5GFms",
  authDomain:"dekorchu-siparis-bfe48.firebaseapp.com",
  projectId:"dekorchu-siparis-bfe48"
});
const db=firebase.firestore();

let catalogs=[];

/* TOAST */
function toast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2000);
}

/* NAV */
function show(id){
  document.querySelectorAll(".container").forEach(c=>c.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

/* DEVAM */
function goHouse(){
  if(!/^5\d{9}$/.test(custPhone.value)) return toast("Telefon hatalı");
  show("house");
}

/* ODALAR */
function loadRooms(){
  rooms.innerHTML="";
  ["Salon","Yatak Odası","Mutfak"].forEach(r=>{
    rooms.innerHTML+=`
    <div class="room">
      <b>${r}</b>
      <div class="walls"></div>
      <button class="small-btn" onclick="addWall(this)">+ Duvar</button>
    </div>`;
  });
}

/* DUVAR */
function addWall(btn){
  let w=btn.previousElementSibling;
  let options=catalogs.map(c=>`<option>${c}</option>`).join("");
  w.innerHTML+=`
    <div class="wall">
      <select>${options}</select>
      <input placeholder="Kod">
    </div>`;
}

/* KATALOG EKLE */
function addCatalog(){
  let name=catalogName.value.trim();
  if(!name) return toast("Boş");
  if(catalogs.includes(name)) return toast("Zaten var");

  db.collection("catalog").add({name});
  catalogName.value="";
  toast("Eklendi");
}

/* KATALOG LİSTE */
db.collection("catalog").onSnapshot(snap=>{
  catalogList.innerHTML="";
  catalogs=[];
  snap.forEach(doc=>{
    catalogs.push(doc.data().name);
    catalogList.innerHTML+=`
      <div class="room">
        ${doc.data().name}
        <button class="small-btn" onclick="db.collection('catalog').doc('${doc.id}').delete()">Sil</button>
      </div>`;
  });
});

/* SİPARİŞ */
function saveOrder(){
  db.collection("orders").add({
    name:custName.value,
    phone:custPhone.value,
    date:new Date().toLocaleString()
  });
  toast("Kaydedildi ✔");
}

/* SİPARİŞ LİSTE */
db.collection("orders").onSnapshot(snap=>{
  orderHistory.innerHTML="";
  snap.forEach(doc=>{
    let o=doc.data();
    orderHistory.innerHTML+=`
      <div class="room">
        ${o.name}<br>${o.phone}
        <button class="small-btn" onclick="db.collection('orders').doc('${doc.id}').delete()">Sil</button>
      </div>`;
  });
});

/* ADMIN */
function adminLogin(){
  if(adminUser.value==="yönetici" && adminPass.value==="dekorchu"){
    show("admin");
  }else toast("Hatalı giriş");
}
</script>

</body>
</html>
