<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEKORCHU</title>

<style>
:root{
  --bg:#0b0b10;
  --panel:#14141c;
  --gold:#d4af37;
  --text:#f5f5f5;
}
*{box-sizing:border-box;font-family:Segoe UI,Arial}
body{margin:0;background:var(--bg);color:var(--text);}

.pattern{
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(212,175,55,.12), transparent 40%),
    repeating-linear-gradient(45deg, rgba(212,175,55,.05), rgba(212,175,55,.05) 1px, transparent 1px, transparent 60px);
  animation:bg 60s linear infinite;
  z-index:-1;
}
@keyframes bg{to{background-position:1000px 1000px}}

header{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 26px;border-bottom:1px solid #222;
}
.logo{
  font-size:36px;font-weight:800;color:var(--gold);
  animation:glow 3s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{text-shadow:0 0 15px var(--gold)}
  50%{text-shadow:0 0 35px var(--gold)}
}
nav button{
  background:transparent;border:1px solid var(--gold);
  color:var(--gold);padding:8px 14px;
  margin-left:10px;border-radius:8px;cursor:pointer;
}
nav button:hover{background:var(--gold);color:#000}

.container{
  max-width:520px;margin:40px auto;
  background:var(--panel);padding:26px;
  border-radius:16px;box-shadow:0 0 25px rgba(0,0,0,.6);
}
.hidden{display:none}

input,select,textarea{
  width:100%;margin-top:10px;padding:12px;
  border-radius:10px;background:#101018;
  border:1px solid #333;color:white;
}
button.main{
  width:100%;margin-top:18px;padding:15px;
  background:var(--gold);color:#000;
  border:none;border-radius:12px;font-size:16px;
  cursor:pointer;
}
.room{margin-top:14px;padding:14px;background:#1b1b26;border-radius:12px}
.wall{margin-top:8px;padding:8px;background:#20202b;border-radius:8px}
.small-btn{
  margin-top:8px;background:transparent;border:1px solid var(--gold);
  color:var(--gold);padding:6px 10px;border-radius:6px;cursor:pointer;
}
.small-btn:hover{background:var(--gold);color:#000}
</style>
</head>

<body>
<div class="pattern"></div>

<header>
  <div class="logo">DEKORCHU</div>
  <nav>
    <button onclick="show('order')">Sipariş</button>
    <button onclick="show('adminLogin')">Yönetici</button>
  </nav>
</header>

<!-- SİPARİŞ -->
<div class="container" id="order">
  <h2>Müşteri Bilgileri</h2>
  <input id="custName" placeholder="Ad Soyad">
  <input id="custPhone" placeholder="Telefon (5XXXXXXXXX – başına 0 yazmayın)"
    maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
  <button class="main" onclick="goHouse()">Devam Et</button>
</div>

<!-- EV -->
<div class="container hidden" id="house">
  <h2>Evin Kaç Artı Bir?</h2>
  <select id="houseType" onchange="loadRooms()">
    <option value="">Seçiniz</option>
    <option>1+1</option><option>2+1</option><option>2.5+1</option>
    <option>3+1</option><option>3.5+1</option><option>4.5+1</option>
  </select>
  <div id="rooms"></div>
  <textarea id="orderNote" placeholder="Genel Sipariş Notu"></textarea>
  <button class="main" onclick="saveOrder()">Siparişi Kaydet</button>
</div>

<!-- ADMIN LOGIN -->
<div class="container hidden" id="adminLogin">
  <h2>Yönetici Girişi</h2>
  <input id="adminUser" placeholder="Kullanıcı adı">
  <input id="adminPass" type="password" placeholder="Şifre">
  <button class="main" onclick="adminLogin()">Giriş</button>
</div>

<!-- ADMIN -->
<div class="container hidden" id="admin">
  <h2>Geçmiş Siparişler</h2>
  <div id="orderHistory"></div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB_uliTJMGnjbA65mlGo3Mu20A8w-5GFms",
  authDomain: "dekorchu-siparis-bfe48.firebaseapp.com",
  projectId: "dekorchu-siparis-bfe48",
  storageBucket: "dekorchu-siparis-bfe48.firebasestorage.app",
  messagingSenderId: "109206944615",
  appId: "1:109206944615:web:6d15e84aabd910536a4dc2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function show(id){
  document.querySelectorAll(".container").forEach(c=>c.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function goHouse(){
  if(!custName.value || custPhone.value.length!==10 || !custPhone.value.startsWith("5")){
    alert("Bilgileri doğru girin"); return;
  }
  show("house");
}

function loadRooms(){
  const map={
    "1+1":["Salon","Mutfak","Banyo / WC"],
    "2+1":["Salon","Yatak Odası","Çocuk Odası","Mutfak","Banyo / WC"],
    "2.5+1":["Salon","Yatak Odası","Çocuk Odası","Misafir Odası","Mutfak","Banyo / WC"],
    "3+1":["Salon","Yatak Odası","Çocuk Odası","Misafir Odası","Mutfak","Banyo / WC"],
    "3.5+1":["Salon","Yatak Odası","Çocuk Odası","Misafir Odası","Çalışma Odası","Mutfak","Banyo / WC","Ebeveyn Banyosu"],
    "4.5+1":["Salon","Yatak Odası","Çocuk Odası","Çocuk Odası 2","Misafir Odası","Çalışma Odası","Mutfak","Banyo / WC","Ebeveyn Banyosu"]
  };
  rooms.innerHTML="";
  if(!houseType.value)return;
  map[houseType.value].forEach(r=>{
    rooms.innerHTML+=`
      <div class="room"><b>${r}</b>
        <div class="wall">
          Katalog: <input placeholder="Katalog">
          Kod: <input placeholder="Kağıt Kodu">
        </div>
      </div>`;
  });
}

function saveOrder(){
  db.collection("orders").add({
    name:custName.value,
    phone:custPhone.value,
    house:houseType.value,
    note:orderNote.value,
    date:new Date().toLocaleString()
  }).then(()=>{
    alert("Sipariş kaydedildi");
    location.reload();
  });
}

function adminLogin(){
  if(adminUser.value==="yönetici" && adminPass.value==="dekorchu"){
    show("admin");
    db.collection("orders").orderBy("date","desc")
      .onSnapshot(s=>{
        orderHistory.innerHTML="";
        s.forEach(d=>{
          const o=d.data();
          orderHistory.innerHTML+=`
            <div class="room">
              <b>${o.name}</b> (${o.phone})<br>
              ${o.house} – ${o.date}<br>
              ${o.note||""}
            </div>`;
        });
      });
  } else alert("Hatalı giriş");
}
</script>
</body>
</html>
