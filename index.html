<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEKORCHU</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#0b0b10;
  --panel:#14141c;
  --gold:#d4af37;
}
body{margin:0;background:var(--bg);color:#fff;font-family:Segoe UI}

/* ARKA PLAN */
.pattern{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 20% 30%, rgba(212,175,55,.15), transparent 40%),
    repeating-linear-gradient(45deg, rgba(212,175,55,.05), transparent 60px);
  animation:bg 60s linear infinite;
}
@keyframes bg{to{background-position:1000px 1000px}}

.container{
  max-width:540px;margin:25px auto;
  background:var(--panel);padding:20px;border-radius:14px;
  animation:fade .4s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}

.hidden{display:none}

input,select,textarea{
  width:100%;margin-top:10px;padding:12px;
  background:#101018;border:1px solid #333;
  color:#fff;border-radius:10px
}

/* BUTON */
button.main{
  width:100%;margin-top:14px;padding:13px;
  border:none;border-radius:12px;
  background:linear-gradient(135deg,#f5d76e,#d4af37);
  color:#000;cursor:pointer;
  box-shadow:0 0 15px rgba(212,175,55,.6);
  transition:.3s;
}
button.main:hover{
  transform:scale(1.03);
  box-shadow:0 0 30px rgba(212,175,55,.9);
}

.small-btn{
  border:1px solid var(--gold);
  background:transparent;color:var(--gold);
  padding:4px 8px;border-radius:6px;
  cursor:pointer;margin-top:6px;
}

/* BLOKLAR */
.room{margin-top:10px;padding:10px;background:#1b1b26;border-radius:10px}
.wall{margin-top:6px;padding:6px;background:#20202b;border-radius:6px}

/* TOAST */
#toast{
  position:fixed;
  bottom:20px;left:50%;
  transform:translateX(-50%);
  background:var(--gold);
  color:#000;padding:10px 20px;
  border-radius:10px;
  display:none;
  box-shadow:0 0 20px rgba(212,175,55,.8);
}
</style>
</head>

<body>
<div class="pattern"></div>

<div id="toast"></div>

<!-- MÜŞTERİ -->
<div class="container" id="order">
  <h3>Müşteri Bilgisi</h3>
  <input id="custName" placeholder="Ad Soyad">
  <input id="custPhone" maxlength="10" placeholder="5XXXXXXXXX"
    oninput="this.value=this.value.replace(/[^0-9]/g,'')">
  <button class="main" onclick="goHouse()">Devam Et</button>
</div>

<!-- EV -->
<div class="container hidden" id="house">
  <select id="houseType" onchange="loadRooms()">
    <option value="">Ev tipi seç</option>
    <option>1+1</option>
    <option>2+1</option>
    <option>2.5+1</option>
    <option>3+1</option>
    <option>3.5+1</option>
    <option>4.5+1</option>
  </select>

  <div id="rooms"></div>

  <textarea id="note" placeholder="Genel Not"></textarea>

  <button class="main" onclick="saveOrder()">Siparişi Kaydet</button>
</div>

<!-- ADMIN -->
<div class="container" id="admin">
  <h3>Katalog Yönetimi</h3>
  <input id="catalogName" placeholder="Katalog adı">
  <button class="main" onclick="addCatalog()">Ekle</button>
  <div id="catalogList"></div>

  <h3>Siparişler</h3>
  <div id="orderHistory"></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyB_uliTJMGnjbA65mlGo3Mu20A8w-5GFms",
  authDomain:"dekorchu-siparis-bfe48.firebaseapp.com",
  projectId:"dekorchu-siparis-bfe48"
});
const db=firebase.firestore();

let catalogs=[];

/* TOAST */
function toast(msg){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2000);
}

/* DEVAM */
function goHouse(){
  if(!/^5\d{9}$/.test(custPhone.value)) return toast("Telefon hatalı");
  order.classList.add("hidden");
  house.classList.remove("hidden");
}

/* ODALAR */
function loadRooms(){
  const map={
    "1+1":["Salon","Mutfak","Banyo"],
    "2+1":["Salon","Yatak Odası","Çocuk Odası","Mutfak","Banyo"],
    "2.5+1":["Salon","Yatak Odası","Çocuk Odası","Misafir Odası","Mutfak","Banyo"],
    "3+1":["Salon","Yatak Odası","Çocuk Odası","Misafir Odası","Mutfak","Banyo"],
    "3.5+1":["Salon","Yatak Odası","Çocuk Odası","Misafir Odası","Çalışma Odası","Mutfak","Banyo","Ebeveyn Banyosu"],
    "4.5+1":["Salon","Yatak Odası","Çocuk Odası","Çocuk Odası 2","Misafir Odası","Çalışma Odası","Mutfak","Banyo","Ebeveyn Banyosu"]
  };

  rooms.innerHTML="";
  map[houseType.value]?.forEach(r=>{
    rooms.innerHTML+=`
      <div class="room">
        <b>${r}</b>
        <div class="walls"></div>
        <button class="small-btn" onclick="addWall(this)">+ Duvar</button>
      </div>`;
  });
}

/* DUVAR */
function addWall(btn){
  let w=btn.previousElementSibling;
  if(w.children.length>=4) return toast("Max 4 duvar");
  let options=catalogs.map(c=>`<option>${c}</option>`).join("");
  w.innerHTML+=`
    <div class="wall">
      <select>${options}</select>
      <input placeholder="Kağıt Kodu">
    </div>`;
}

/* SİPARİŞ */
function saveOrder(){
  let data={
    name:custName.value,
    phone:custPhone.value,
    note:note.value,
    date:new Date().toLocaleString(),
    rooms:[]
  };

  document.querySelectorAll(".room").forEach(r=>{
    let rn=r.querySelector("b").innerText;
    r.querySelectorAll(".wall").forEach(w=>{
      data.rooms.push({
        room:rn,
        catalog:w.querySelector("select").value,
        code:w.querySelector("input").value
      });
    });
  });

  db.collection("orders").add(data);
  toast("Kaydedildi ✔");
}

/* KATALOG */
function addCatalog(){
  let n=catalogName.value.trim();
  if(!n) return toast("Boş");
  if(catalogs.includes(n)) return toast("Zaten var");
  db.collection("catalog").add({name:n});
  catalogName.value="";
}

/* KATALOG LİSTE */
db.collection("catalog").onSnapshot(snap=>{
  catalogs=[];
  catalogList.innerHTML="";
  snap.forEach(doc=>{
    catalogs.push(doc.data().name);
    catalogList.innerHTML+=`
      <div class="room">
        ${doc.data().name}
        <button class="small-btn" onclick="db.collection('catalog').doc('${doc.id}').delete()">Sil</button>
      </div>`;
  });
});

/* SİPARİŞ LİSTE */
db.collection("orders").onSnapshot(snap=>{
  orderHistory.innerHTML="";
  snap.forEach(doc=>{
    let o=doc.data();
    let detail=o.rooms.map(r=>`${r.room} → ${r.catalog} / ${r.code}`).join("<br>");

    orderHistory.innerHTML+=`
      <div class="room">
        <b>${o.name}</b> - ${o.phone}
        <button class="small-btn" onclick="this.nextElementSibling.classList.toggle('hidden')">İncele</button>
        <div class="hidden">${detail}<br><i>${o.note||""}</i></div>
        <button class="small-btn" onclick="db.collection('orders').doc('${doc.id}').delete()">Sil</button>
      </div>`;
  });
});
</script>

</body>
</html>
