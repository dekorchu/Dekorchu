<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Dekorchu Sipariş</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{
  margin:0;
  background:#0f0f0f;
  color:#fff;
  overflow-x:hidden;
}
.bg{
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,215,0,.12),transparent 40%),
    radial-gradient(circle at 80% 80%,rgba(255,215,0,.08),transparent 40%);
  animation:move 20s linear infinite;
  z-index:-1;
}
@keyframes move{
  0%{transform:translate(0,0)}
  50%{transform:translate(-40px,30px)}
  100%{transform:translate(0,0)}
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
}
.logo{
  font-size:34px;
  font-weight:bold;
  color:#FFD700;
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{text-shadow:0 0 5px #FFD700}
  to{text-shadow:0 0 20px #FFD700}
}
nav button{
  background:none;
  border:1px solid #FFD700;
  color:#FFD700;
  padding:8px 14px;
  border-radius:8px;
  margin-left:10px;
  cursor:pointer;
}
section{display:none;padding:25px}
section.active{display:block}
.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  max-width:900px;
  margin:auto;
}
input,select,textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
  border:none;
}
button.main{
  background:linear-gradient(45deg,#FFD700,#ffea80);
  border:none;
  padding:12px 18px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px rgba(255,215,0,.6);
}
.list{display:flex;gap:20px}
.list > div{flex:1}
.item{
  padding:10px;
  border-bottom:1px solid #333;
  cursor:pointer;
}
.item:hover{background:#222}
.small{font-size:13px;color:#bbb}
</style>
</head>

<body>
<div class="bg"></div>

<header>
  <div class="logo">DEKORCHU</div>
  <nav>
    <button onclick="show('order')">Sipariş</button>
    <button onclick="show('adminLogin')">Yönetici</button>
  </nav>
</header>

<!-- SİPARİŞ -->
<section id="order" class="active">
  <div class="card">
    <h2>Müşteri Bilgileri</h2>
    <input id="name" placeholder="Ad Soyad">
    <input id="phone" placeholder="5XXXXXXXXX">
    <button class="main" onclick="nextRoom()">Devam Et</button>
  </div>
</section>

<!-- ODA -->
<section id="room">
  <div class="card">
    <h2>Oda Seç</h2>
    <select id="roomSel" onchange="loadWalls()">
      <option value="">Seçiniz</option>
      <option>Salon</option>
      <option>Yatak Odası</option>
      <option>Çocuk Odası</option>
      <option>Mutfak</option>
      <option>Banyo</option>
      <option>Ebeveyn Banyosu</option>
    </select>
    <div id="walls"></div>
    <textarea id="note" placeholder="Not (en sona yazılır)"></textarea>
    <button class="main" onclick="saveOrder()">Siparişi Kaydet</button>
  </div>
</section>

<!-- ADMIN LOGIN -->
<section id="adminLogin">
  <div class="card">
    <h2>Yönetici Girişi</h2>
    <input id="auser" placeholder="Kullanıcı">
    <input id="apass" type="password" placeholder="Şifre">
    <button class="main" onclick="login()">Giriş</button>
  </div>
</section>

<!-- ADMIN -->
<section id="admin">
  <div class="list">
    <div class="card">
      <h3>📚 Katalog Yönetimi</h3>
      <input id="catName" placeholder="Katalog Adı">
      <button class="main" onclick="addCatalog()">Ekle</button>
      <div id="catList"></div>
    </div>

    <div class="card">
      <h3>🕓 Geçmiş Siparişler</h3>
      <div id="orderList"></div>
    </div>
  </div>
</section>

<script>
const catalogs=JSON.parse(localStorage.getItem("cats")||"[]");
const orders=JSON.parse(localStorage.getItem("orders")||"[]");

function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="admin") renderAdmin();
}

function nextRoom(){
  if(!name.value||!phone.value.match(/^5\d{9}$/)){
    alert("Bilgiler eksik");
    return;
  }
  show("room");
}

function loadWalls(){
  walls.innerHTML="";
  catalogs.forEach((c,i)=>{
    walls.innerHTML+=`
      <label>Duvar ${i+1} – ${c}</label>
      <select class="wallSel">
        <option>${c}</option>
      </select>
    `;
  });
}

function saveOrder(){
  const sel=[...document.querySelectorAll(".wallSel")].map(s=>s.value);
  orders.push({
    name:name.value,
    phone:phone.value,
    room:roomSel.value,
    walls:sel,
    note:note.value,
    date:new Date().toLocaleString()
  });
  localStorage.setItem("orders",JSON.stringify(orders));
  alert("Kaydedildi");
  location.reload();
}

function login(){
  if(auser.value==="yonetici" && apass.value==="dekorchu"){
    show("admin");
  }else alert("Hatalı");
}

function addCatalog(){
  if(catalogs.includes(catName.value)||!catName.value) return;
  catalogs.push(catName.value);
  localStorage.setItem("cats",JSON.stringify(catalogs));
  renderAdmin();
}

function renderAdmin(){
  catList.innerHTML="";
  catalogs.forEach((c,i)=>{
    catList.innerHTML+=`
      <div class="item">${c}
        <span onclick="delCat(${i})" style="float:right;color:red">Sil</span>
      </div>`;
  });

  orderList.innerHTML="";
  orders.forEach(o=>{
    orderList.innerHTML+=`
      <div class="item">
        ${o.name}
        <div class="small">${o.room} – ${o.walls.join(", ")}</div>
      </div>`;
  });
}

function delCat(i){
  catalogs.splice(i,1);
  localStorage.setItem("cats",JSON.stringify(catalogs));
  renderAdmin();
}
</script>
</body>
</html>
